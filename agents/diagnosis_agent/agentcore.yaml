agents:
  diagnosis_agent:
    aws:
      account: "450410489798"
      region: us-east-1
      execution_role: arn:aws:iam::450410489798:role/agentcore-diagnosis-agent-execution-role
      ecr_repo_name: diagnosis-agent
      docker_image_uri: 450410489798.dkr.ecr.us-east-1.amazonaws.com/diagnosis-agent:latest
    
    name: agentic-diagnosis-agent
    type: worker
    version: "1.0.0"
    entrypoint: src.services.diagnosis_agent.handler
    
    description: |
      Equipment diagnosis and recommendations agent.
      Diagnoses equipment issues, generates maintenance recommendations, calls MCP tools.
      
    dockerfile: deployment/agentcore-runtime/diagnosis_agent.Dockerfile
    
    deployment:
      mode: cloud
      region: us-east-1
      account_id: 450410489798
      
      container:
        image_uri: 450410489798.dkr.ecr.us-east-1.amazonaws.com/diagnosis-agent:latest
        port: 8002
        
      compute:
        cpu: 256
        memory: 512
        timeout: 60
        
      scaling:
        min_instances: 0
        max_instances: 3
        target_utilization: 70
        
      logging:
        cloudwatch_group: /aws/agentcore/diagnosis-agent
        cloudwatch_region: us-east-1
        log_retention_days: 7
        
    health_check:
      endpoint: /health
      interval_seconds: 30
      timeout_seconds: 10
      healthy_threshold: 1
      unhealthy_threshold: 3
      
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      AGENT_NAME: DiagnosisAgent
      AGENT_PORT: "8002"
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "450410489798"
      SYNTHETIC_DATA_BUCKET: agentic-ai-poc-synthetic-data
      SYNTHETIC_DATA_PREFIX: devices/
      AWS_PROFILE: StandardAccess-450410489798
      COGNITO_USER_POOL_ID: us-east-1_R6pOfxcKV
      COGNITO_APP_CLIENT_ID: 51iaqr9v3eupu65dnm8fi8alkj
      COGNITO_DOMAIN_PREFIX: agentic-ai-poc-3-1-auth
      COGNITO_TOKEN_ENDPOINT: "https://agentic-ai-poc-3-1-auth.auth.us-east-1.amazoncognito.com/oauth2/token"
      COGNITO_SCOPE: "agentcore/invoke"
      
    secrets:
      COGNITO_APP_CLIENT_SECRET:
        source: secrets-manager
        arn: "arn:aws:secretsmanager:us-east-1:450410489798:secret:agentic-ai-poc-3-1-cognito-secret"
      GATEWAY_URL:
        source: secrets-manager
        arn: "arn:aws:secretsmanager:us-east-1:450410489798:secret:agentic-ai-poc-gateway-url"
    
    permissions:
      iam:
        assume_role_policy:
          - Service: agentcore.bedrock.amazonaws.com
            Action: sts:AssumeRole
            
        policies:
          - name: s3-access
            description: Read device and spare parts data from S3
            actions:
              - s3:GetObject
              - s3:ListBucket
            resources:
              - "arn:aws:s3:::agentic-ai-poc-synthetic-data"
              - "arn:aws:s3:::agentic-ai-poc-synthetic-data/*"
              
          - name: bedrock-access
            description: Invoke Bedrock Claude models for diagnostics
            actions:
              - bedrock:InvokeModel
              - bedrock:InvokeAgent
            resources:
              - "*"
              
          - name: mcp-tools-access
            description: Invoke MCP tool Lambda functions and AppRunner services
            actions:
              - lambda:InvokeFunction
              - apprunner:DescribeService
            resources:
              - "arn:aws:lambda:us-east-1:450410489798:function:*"
              - "*"
