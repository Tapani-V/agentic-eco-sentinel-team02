agents:
  orchestrator:
    aws:
      account: "450410489798"
      region: us-east-1
      execution_role: arn:aws:iam::450410489798:role/agentcore-orchestrator-execution-role
      ecr_repo_name: orchestrator
      docker_image_uri: 450410489798.dkr.ecr.us-east-1.amazonaws.com/orchestrator:latest
    
    name: agentic-orchestrator
    type: orchestrator
    version: "1.0.0"
    entrypoint: src.services.orchestrator.handler
    
    description: |
      Multi-agent orchestrator for equipment health and diagnosis.
      Coordinates health and diagnosis agents, routes requests, manages workflow.
      
    dockerfile: deployment/agentcore-runtime/orchestrator.Dockerfile
    
    deployment:
      mode: cloud
      region: us-east-1
      account_id: 450410489798
      
      container:
        image_uri: 450410489798.dkr.ecr.us-east-1.amazonaws.com/orchestrator:latest
        port: 8000
        
      compute:
        cpu: 256
        memory: 512
        timeout: 60
        
      scaling:
        min_instances: 1
        max_instances: 5
        target_utilization: 70
        
      logging:
        cloudwatch_group: /aws/agentcore/orchestrator
        cloudwatch_region: us-east-1
        log_retention_days: 7
        
    health_check:
      endpoint: /health
      interval_seconds: 30
      timeout_seconds: 10
      healthy_threshold: 1
      unhealthy_threshold: 3
      
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      AGENT_NAME: Orchestrator
      AGENT_PORT: "8000"
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "450410489798"
      SYNTHETIC_DATA_BUCKET: agentic-ai-poc-synthetic-data
      SYNTHETIC_DATA_PREFIX: devices/
      AWS_PROFILE: StandardAccess-450410489798
      COGNITO_USER_POOL_ID: us-east-1_R6pOfxcKV
      COGNITO_APP_CLIENT_ID: 51iaqr9v3eupu65dnm8fi8alkj
      COGNITO_DOMAIN_PREFIX: agentic-ai-poc-3-1-auth
      COGNITO_TOKEN_ENDPOINT: "https://agentic-ai-poc-3-1-auth.auth.us-east-1.amazoncognito.com/oauth2/token"
      COGNITO_SCOPE: "agentcore/invoke"
      HEALTH_AGENT_URL: "http://agentic-health-agent:8001"
      DIAGNOSIS_AGENT_URL: "http://agentic-diagnosis-agent:8002"
      
    secrets:
      COGNITO_APP_CLIENT_SECRET:
        source: secrets-manager
        arn: "arn:aws:secretsmanager:us-east-1:450410489798:secret:agentic-ai-poc-3-1-cognito-secret"
      GATEWAY_URL:
        source: secrets-manager
        arn: "arn:aws:secretsmanager:us-east-1:450410489798:secret:agentic-ai-poc-gateway-url"
    
    permissions:
      iam:
        assume_role_policy:
          - Service: agentcore.bedrock.amazonaws.com
            Action: sts:AssumeRole
            
        policies:
          - name: s3-access
            description: Read synthetic device data from S3
            actions:
              - s3:GetObject
              - s3:ListBucket
            resources:
              - "arn:aws:s3:::agentic-ai-poc-synthetic-data"
              - "arn:aws:s3:::agentic-ai-poc-synthetic-data/*"
              
          - name: cognito-access
            description: User authentication via Cognito
            actions:
              - cognito-idp:AdminGetUser
              - cognito-idp:AdminUpdateUserAttributes
            resources:
              - "arn:aws:cognito-idp:us-east-1:450410489798:userpool/us-east-1_R6pOfxcKV"
              
          - name: bedrock-access
            description: Invoke Bedrock Claude models
            actions:
              - bedrock:InvokeModel
              - bedrock:InvokeAgent
            resources:
              - "*"
