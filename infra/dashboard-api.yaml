AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Dashboard API — Lambda + HTTP API Gateway for the FastAPI Dashboard_Service.
  Exposes /api/* endpoints consumed by the React frontend on CloudFront.

Parameters:
  ResourcePrefix:
    Type: String
    Default: team1-
    Description: Prefix for all resource names (e.g. team1-)

  OrchestratorUrl:
    Type: String
    Default: https://mn6y8y0u26.execute-api.eu-central-1.amazonaws.com/prod/orchestrate
    Description: URL of the orchestrator API Gateway endpoint

Resources:
  # --- IAM Role for Lambda ---
  DashboardLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}dashboard-api-lambda-role'
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/GroupIT_ProjectPermissionBoundary'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # --- Lambda Function ---
  DashboardFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ResourcePrefix}dashboard-api-handler'
      Runtime: python3.11
      Handler: src.dashboard.lambda_handler.handler
      Code:
        S3Bucket: !Sub '${ResourcePrefix}dashboard-api-code'
        S3Key: lambda-package.zip
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt DashboardLambdaRole.Arn
      Environment:
        Variables:
          ORCHESTRATOR_URL: !Ref OrchestratorUrl
          LOG_LEVEL: INFO
          ENABLE_CACHE: 'true'
          CACHE_DURATION: '360'
          RESOURCE_PREFIX: !Ref ResourcePrefix
          AWS_REGION_NAME: 'eu-central-1'

  # --- HTTP API Gateway ---
  DashboardApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ResourcePrefix}dashboard-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - '*'

  # --- Lambda Integration ---
  DashboardIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DashboardApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DashboardFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  # --- Catch-all route ---
  DashboardRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${DashboardIntegration}'

  # --- Default Stage (auto-deploy) ---
  DashboardStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref DashboardApi
      StageName: '$default'
      AutoDeploy: true

  # --- Lambda Permission for API Gateway ---
  DashboardLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DashboardFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DashboardApi}/*'

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL
    Value: !GetAtt DashboardApi.ApiEndpoint

  ApiId:
    Description: HTTP API Gateway ID
    Value: !Ref DashboardApi

  FunctionName:
    Description: Lambda function name
    Value: !Ref DashboardFunction
