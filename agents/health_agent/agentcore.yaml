agents:
  health_agent:
    aws:
      account: "450410489798"
      region: us-east-1
      execution_role: arn:aws:iam::450410489798:role/agentcore-health-agent-execution-role
      ecr_repo_name: health-agent
      docker_image_uri: 450410489798.dkr.ecr.us-east-1.amazonaws.com/health-agent:latest
    
    name: agentic-health-agent
    type: worker
    version: "1.0.0"
    entrypoint: src.services.health_agent.handler
    
    description: |
      Equipment health analysis agent.
      Analyzes sensor data, generates health scores, identifies anomalies.
      
    dockerfile: deployment/agentcore-runtime/health_agent.Dockerfile
    
    deployment:
      mode: cloud
      region: us-east-1
      account_id: 450410489798
      
      container:
        image_uri: 450410489798.dkr.ecr.us-east-1.amazonaws.com/health-agent:latest
        port: 8001
        
      compute:
        cpu: 256
        memory: 512
        timeout: 30
        
      scaling:
        min_instances: 0
        max_instances: 3
        target_utilization: 70
        
      logging:
        cloudwatch_group: /aws/agentcore/health-agent
        cloudwatch_region: us-east-1
        log_retention_days: 7
        
    health_check:
      endpoint: /health
      interval_seconds: 30
      timeout_seconds: 10
      healthy_threshold: 1
      unhealthy_threshold: 3
      
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      AGENT_NAME: HealthAgent
      AGENT_PORT: "8001"
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "450410489798"
      SYNTHETIC_DATA_BUCKET: agentic-ai-poc-synthetic-data
      SYNTHETIC_DATA_PREFIX: devices/
      AWS_PROFILE: StandardAccess-450410489798
      COGNITO_USER_POOL_ID: us-east-1_R6pOfxcKV
      COGNITO_APP_CLIENT_ID: 51iaqr9v3eupu65dnm8fi8alkj
      COGNITO_DOMAIN_PREFIX: agentic-ai-poc-3-1-auth
      COGNITO_TOKEN_ENDPOINT: "https://agentic-ai-poc-3-1-auth.auth.us-east-1.amazoncognito.com/oauth2/token"
      COGNITO_SCOPE: "agentcore/invoke"
      
    secrets:
      COGNITO_APP_CLIENT_SECRET:
        source: secrets-manager
        arn: "arn:aws:secretsmanager:us-east-1:450410489798:secret:agentic-ai-poc-3-1-cognito-secret"
      GATEWAY_URL:
        source: secrets-manager
        arn: "arn:aws:secretsmanager:us-east-1:450410489798:secret:agentic-ai-poc-gateway-url"
    
    permissions:
      iam:
        assume_role_policy:
          - Service: agentcore.bedrock.amazonaws.com
            Action: sts:AssumeRole
            
        policies:
          - name: s3-access
            description: Read synthetic device data from S3
            actions:
              - s3:GetObject
              - s3:ListBucket
            resources:
              - "arn:aws:s3:::agentic-ai-poc-synthetic-data"
              - "arn:aws:s3:::agentic-ai-poc-synthetic-data/*"
              
          - name: bedrock-access
            description: Invoke Bedrock Claude models for analysis
            actions:
              - bedrock:InvokeModel
              - bedrock:InvokeAgent
            resources:
              - "*"
